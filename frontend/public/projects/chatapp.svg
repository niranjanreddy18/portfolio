<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#181335" />
    </linearGradient>
    <linearGradient id="chatBubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="sidebarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad2)" />

  <!-- Subtle grid lines -->
  <g stroke="#38bdf8" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Ambient Glow Circles -->
  <circle cx="180" cy="120" r="130" fill="#0284c7" opacity="0.12" filter="url(#glow2)" />
  <circle cx="650" cy="320" r="140" fill="#8b5cf6" opacity="0.1" filter="url(#glow2)" />

  <!-- App Window Frame -->
  <rect x="60" y="45" width="680" height="360" rx="14" fill="#0b1120" stroke="#334155" stroke-opacity="0.6" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="60" y="45" width="680" height="46" rx="14" fill="#111827" />
  <rect x="60" y="77" width="680" height="14" fill="#111827" />
  <line x1="60" y1="91" x2="740" y2="91" stroke="#1f2937" stroke-width="1" />
  
  <!-- Window Dots -->
  <circle cx="90" cy="68" r="5" fill="#ef4444" />
  <circle cx="106" cy="68" r="5" fill="#f59e0b" />
  <circle cx="122" cy="68" r="5" fill="#10b981" />

  <!-- URL Bar Mockup -->
  <rect x="160" y="58" width="480" height="20" rx="6" fill="#1f2937" />
  <text x="180" y="72" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="10">https://chatapp-one-neon.vercel.app</text>

  <!-- Left Channels Sidebar -->
  <rect x="80" y="110" width="180" height="275" rx="8" fill="url(#sidebarGrad)" stroke="#334155" stroke-opacity="0.5" stroke-width="1" />
  <text x="96" y="138" fill="#f8fafc" font-family="'Syne', sans-serif" font-weight="bold" font-size="14">Chat Channels</text>
  <circle cx="230" cy="134" r="4" fill="#10b981" />
  <text x="238" y="137" fill="#10b981" font-family="'DM Mono', monospace" font-size="9">LIVE</text>

  <!-- Channel 1 (Active) -->
  <rect x="92" y="156" width="156" height="36" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" />
  <circle cx="110" cy="174" r="8" fill="#0284c7" />
  <text x="106" y="178" fill="#fff" font-family="sans-serif" font-size="10">#</text>
  <text x="126" y="172" fill="#38bdf8" font-family="sans-serif" font-weight="600" font-size="11">engineering-hub</text>
  <text x="126" y="185" fill="#64748b" font-family="'DM Mono', monospace" font-size="8">4 online</text>

  <!-- Channel 2 -->
  <rect x="92" y="200" width="156" height="36" rx="6" fill="#1e293b" fill-opacity="0.4" />
  <circle cx="110" cy="218" r="8" fill="#334155" />
  <text x="106" y="222" fill="#94a3b8" font-family="sans-serif" font-size="10">#</text>
  <text x="126" y="216" fill="#cbd5e1" font-family="sans-serif" font-size="11">general-chat</text>
  <text x="126" y="229" fill="#64748b" font-family="'DM Mono', monospace" font-size="8">12 members</text>

  <!-- Channel 3 -->
  <rect x="92" y="244" width="156" height="36" rx="6" fill="#1e293b" fill-opacity="0.4" />
  <circle cx="110" cy="262" r="8" fill="#334155" />
  <text x="106" y="266" fill="#94a3b8" font-family="sans-serif" font-size="10">#</text>
  <text x="126" y="260" fill="#cbd5e1" font-family="sans-serif" font-size="11">project-demos</text>
  <text x="126" y="273" fill="#64748b" font-family="'DM Mono', monospace" font-size="8">8 members</text>

  <!-- Tech Pill in sidebar -->
  <rect x="92" y="325" width="156" height="45" rx="6" fill="#030712" stroke="#1f2937" />
  <text x="102" y="342" fill="#38bdf8" font-family="'DM Mono', monospace" font-size="9">⚡ Django Channels</text>
  <text x="102" y="357" fill="#a78bfa" font-family="'DM Mono', monospace" font-size="9">🔄 Redis Pub/Sub Layer</text>

  <!-- Main Chat Conversation Panel -->
  <rect x="275" y="110" width="445" height="275" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-opacity="0.5" stroke-width="1" />
  
  <!-- Conversation Header -->
  <rect x="275" y="110" width="445" height="38" rx="8" fill="#1e293b" fill-opacity="0.5" />
  <text x="295" y="134" fill="#f8fafc" font-family="sans-serif" font-weight="600" font-size="12"># engineering-hub</text>
  <text x="430" y="134" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="10">WebSocket Status: Connected</text>
  <circle cx="685" cy="130" r="4" fill="#10b981" />

  <!-- Incoming Message Bubble -->
  <circle cx="305" cy="175" r="14" fill="#334155" />
  <text x="299" y="180" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="11">A</text>
  <rect x="328" y="160" width="220" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-opacity="0.6" />
  <text x="340" y="181" fill="#e2e8f0" font-family="sans-serif" font-size="11">Messages stream in milliseconds!</text>

  <!-- Outgoing Message Bubble (Right) -->
  <rect x="445" y="206" width="230" height="34" rx="8" fill="url(#chatBubble)" />
  <text x="458" y="227" fill="#ffffff" font-family="sans-serif" font-size="11">Handled via Redis &amp; PostgreSQL 🚀</text>

  <!-- Typing Indicator Message -->
  <rect x="328" y="252" width="140" height="24" rx="6" fill="#1e293b" fill-opacity="0.6" />
  <circle cx="346" cy="264" r="3" fill="#38bdf8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite" />
  </circle>
  <circle cx="356" cy="264" r="3" fill="#38bdf8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="0.2s" repeatCount="indefinite" />
  </circle>
  <circle cx="366" cy="264" r="3" fill="#38bdf8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="0.4s" repeatCount="indefinite" />
  </circle>
  <text x="380" y="268" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="9">typing...</text>

  <!-- Chat Input Bar -->
  <rect x="290" y="335" width="415" height="36" rx="8" fill="#111827" stroke="#334155" stroke-opacity="0.8" />
  <text x="306" y="357" fill="#64748b" font-family="sans-serif" font-size="11">Type a real-time message...</text>
  <rect x="645" y="340" width="50" height="26" rx="5" fill="#0284c7" />
  <text x="658" y="357" fill="#fff" font-family="sans-serif" font-weight="600" font-size="10">Send</text>
</svg>
