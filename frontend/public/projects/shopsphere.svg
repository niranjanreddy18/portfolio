<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1222" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Subtle grid lines -->
  <g stroke="#38bdf8" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Ambient Glow Circles -->
  <circle cx="680" cy="100" r="120" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
  <circle cx="150" cy="350" r="140" fill="#a855f7" opacity="0.1" filter="url(#glow)" />

  <!-- App Window Frame -->
  <rect x="60" y="45" width="680" height="360" rx="14" fill="#0b1120" stroke="#334155" stroke-opacity="0.6" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="60" y="45" width="680" height="46" rx="14" fill="#111827" />
  <rect x="60" y="77" width="680" height="14" fill="#111827" />
  <line x1="60" y1="91" x2="740" y2="91" stroke="#1f2937" stroke-width="1" />
  
  <!-- Window Dots -->
  <circle cx="90" cy="68" r="5" fill="#ef4444" />
  <circle cx="106" cy="68" r="5" fill="#f59e0b" />
  <circle cx="122" cy="68" r="5" fill="#10b981" />

  <!-- URL Bar Mockup -->
  <rect x="160" y="58" width="480" height="20" rx="6" fill="#1f2937" />
  <text x="180" y="72" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="10">https://shopsphere-gamma-puce.vercel.app</text>

  <!-- Left Sidebar (Categories) -->
  <rect x="80" y="110" width="150" height="275" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-opacity="0.4" stroke-width="1" />
  <text x="100" y="140" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="13">Categories</text>
  
  <rect x="96" y="160" width="118" height="26" rx="5" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" />
  <text x="110" y="177" fill="#38bdf8" font-family="sans-serif" font-weight="600" font-size="11">Electronics</text>
  
  <rect x="96" y="196" width="118" height="26" rx="5" fill="#1e293b" fill-opacity="0.5" />
  <text x="110" y="213" fill="#94a3b8" font-family="sans-serif" font-size="11">Fashion</text>

  <rect x="96" y="232" width="118" height="26" rx="5" fill="#1e293b" fill-opacity="0.5" />
  <text x="110" y="249" fill="#94a3b8" font-family="sans-serif" font-size="11">Home &amp; Living</text>

  <rect x="96" y="268" width="118" height="26" rx="5" fill="#1e293b" fill-opacity="0.5" />
  <text x="110" y="285" fill="#94a3b8" font-family="sans-serif" font-size="11">Books</text>

  <!-- Main Content Area -->
  <text x="250" y="138" fill="#f8fafc" font-family="'Syne', sans-serif" font-weight="700" font-size="18">ShopSphere E-Commerce</text>
  <rect x="620" y="122" width="100" height="26" rx="6" fill="#0ea5e9" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.4" />
  <text x="635" y="139" fill="#38bdf8" font-family="'DM Mono', monospace" font-size="10">Cart: 3 items</text>

  <!-- Product Cards Grid -->
  <!-- Card 1 -->
  <rect x="250" y="160" width="145" height="150" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-opacity="0.5" stroke-width="1" />
  <rect x="260" y="170" width="125" height="65" rx="5" fill="#0f172a" />
  <circle cx="322" cy="202" r="20" fill="#38bdf8" fill-opacity="0.15" />
  <text x="312" y="208" fill="#38bdf8" font-size="16">🎧</text>
  <text x="262" y="252" fill="#f1f5f9" font-family="sans-serif" font-weight="600" font-size="11">Wireless Headset</text>
  <text x="262" y="270" fill="#38bdf8" font-family="'DM Mono', monospace" font-weight="600" font-size="11">$149.00</text>
  <rect x="262" y="280" width="121" height="20" rx="4" fill="url(#cyanPurple)" />
  <text x="295" y="294" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="9">Add to Cart</text>

  <!-- Card 2 -->
  <rect x="410" y="160" width="145" height="150" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-opacity="0.5" stroke-width="1" />
  <rect x="420" y="170" width="125" height="65" rx="5" fill="#0f172a" />
  <circle cx="482" cy="202" r="20" fill="#a855f7" fill-opacity="0.15" />
  <text x="472" y="208" fill="#a855f7" font-size="16">⌚</text>
  <text x="422" y="252" fill="#f1f5f9" font-family="sans-serif" font-weight="600" font-size="11">Smart Watch Pro</text>
  <text x="422" y="270" fill="#38bdf8" font-family="'DM Mono', monospace" font-weight="600" font-size="11">$229.00</text>
  <rect x="422" y="280" width="121" height="20" rx="4" fill="url(#cyanPurple)" />
  <text x="455" y="294" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="9">Add to Cart</text>

  <!-- Card 3 -->
  <rect x="570" y="160" width="150" height="150" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-opacity="0.5" stroke-width="1" />
  <rect x="580" y="170" width="130" height="65" rx="5" fill="#0f172a" />
  <circle cx="645" cy="202" r="20" fill="#10b981" fill-opacity="0.15" />
  <text x="635" y="208" fill="#10b981" font-size="16">💻</text>
  <text x="582" y="252" fill="#f1f5f9" font-family="sans-serif" font-weight="600" font-size="11">Ultrabook M2</text>
  <text x="582" y="270" fill="#38bdf8" font-family="'DM Mono', monospace" font-weight="600" font-size="11">$899.00</text>
  <rect x="582" y="280" width="126" height="20" rx="4" fill="url(#cyanPurple)" />
  <text x="618" y="294" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="9">Add to Cart</text>

  <!-- Bottom Checkout Status Bar -->
  <rect x="250" y="325" width="470" height="60" rx="8" fill="#111827" stroke="#334155" stroke-opacity="0.6" stroke-width="1" />
  <text x="270" y="348" fill="#f1f5f9" font-family="sans-serif" font-weight="600" font-size="11">Stripe Checkout &amp; Order Pipeline</text>
  <text x="270" y="368" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="10">JWT Protected • PostgreSQL Database • REST API</text>
  <rect x="630" y="338" width="75" height="26" rx="5" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.5" />
  <text x="643" y="355" fill="#34d399" font-family="'DM Mono', monospace" font-size="9">SECURE</text>
</svg>
