<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="wdsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08141e" />
      <stop offset="50%" stop-color="#0c1d2e" />
      <stop offset="100%" stop-color="#06222b" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="heroCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#132738" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#091b29" stop-opacity="0.9" />
    </linearGradient>
    <filter id="wdsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#wdsBg)" />

  <!-- Subtle dental grid -->
  <g stroke="#2dd4bf" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Glowing Ambiance -->
  <circle cx="680" cy="110" r="140" fill="#2dd4bf" opacity="0.14" filter="url(#wdsGlow)" />
  <circle cx="140" cy="360" r="130" fill="#38bdf8" opacity="0.12" filter="url(#wdsGlow)" />

  <!-- App Window Container -->
  <rect x="60" y="45" width="680" height="360" rx="14" fill="#071520" stroke="#1e3a4f" stroke-width="1.5" />

  <!-- Window Header Bar -->
  <rect x="60" y="45" width="680" height="46" rx="14" fill="#0c1e2b" />
  <rect x="60" y="77" width="680" height="14" fill="#0c1e2b" />
  <line x1="60" y1="91" x2="740" y2="91" stroke="#193245" stroke-width="1" />

  <!-- Window Control Dots -->
  <circle cx="90" cy="68" r="5" fill="#ef4444" />
  <circle cx="106" cy="68" r="5" fill="#f59e0b" />
  <circle cx="122" cy="68" r="5" fill="#10b981" />

  <!-- URL Bar -->
  <rect x="160" y="58" width="480" height="20" rx="6" fill="#142c3d" />
  <text x="180" y="72" fill="#7dd3fc" font-family="'DM Mono', monospace" font-size="10">https://we-design-smiles-seven.vercel.app</text>

  <!-- Navigation Bar Inside Web Page -->
  <rect x="60" y="92" width="680" height="40" fill="#091b29" fill-opacity="0.95" />
  <text x="90" y="117" fill="#ffffff" font-family="'Syne', sans-serif" font-weight="700" font-size="13">WE DESIGN SMILES</text>
  <circle cx="218" cy="113" r="3" fill="#2dd4bf" />
  <text x="240" y="117" fill="#94a3b8" font-family="sans-serif" font-size="10">Treatments</text>
  <text x="315" y="117" fill="#94a3b8" font-family="sans-serif" font-size="10">Transformations</text>
  <text x="415" y="117" fill="#94a3b8" font-family="sans-serif" font-size="10">About Clinic</text>
  <text x="495" y="117" fill="#94a3b8" font-family="sans-serif" font-size="10">Location</text>
  <rect x="605" y="100" width="115" height="24" rx="12" fill="url(#tealGrad)" />
  <text x="622" y="116" fill="#042028" font-family="sans-serif" font-weight="700" font-size="9">Book Appointment</text>

  <!-- Hero Section -->
  <rect x="80" y="145" width="360" height="240" rx="10" fill="url(#heroCardGrad)" stroke="#1e3a4f" stroke-width="1" />
  
  <!-- Clinic Badge -->
  <rect x="100" y="165" width="145" height="20" rx="10" fill="#2dd4bf" fill-opacity="0.15" stroke="#2dd4bf" stroke-opacity="0.4" />
  <text x="110" y="179" fill="#2dd4bf" font-family="'DM Mono', monospace" font-size="9">PREMIUM DENTAL CARE</text>

  <text x="100" y="215" fill="#f8fafc" font-family="'Syne', sans-serif" font-weight="800" font-size="22">Crafting Confident,</text>
  <text x="100" y="242" fill="#2dd4bf" font-family="'Syne', sans-serif" font-weight="800" font-size="22">Radiant Smiles</text>
  
  <text x="100" y="270" fill="#94a3b8" font-family="sans-serif" font-size="11">Experience state-of-the-art dentistry with personalized</text>
  <text x="100" y="286" fill="#94a3b8" font-family="sans-serif" font-size="11">treatment plans and interactive smile visualizers.</text>

  <!-- Frame Scrubbing Animation Indicator -->
  <rect x="100" y="310" width="220" height="26" rx="6" fill="#081622" stroke="#1a3449" />
  <circle cx="115" cy="323" r="5" fill="#2dd4bf" />
  <text x="127" y="327" fill="#7dd3fc" font-family="'DM Mono', monospace" font-size="9">Interactive Frame-Scrub Hero</text>
  <rect x="270" y="316" width="40" height="14" rx="3" fill="#2dd4bf" fill-opacity="0.2" />
  <text x="278" y="327" fill="#2dd4bf" font-family="'DM Mono', monospace" font-size="8">60 FPS</text>

  <!-- Action CTAs -->
  <rect x="100" y="348" width="115" height="26" rx="6" fill="url(#tealGrad)" />
  <text x="118" y="365" fill="#042028" font-family="sans-serif" font-weight="bold" font-size="10">Consult Now →</text>

  <rect x="225" y="348" width="110" height="26" rx="6" fill="#132738" stroke="#2dd4bf" stroke-opacity="0.4" />
  <text x="243" y="365" fill="#e2e8f0" font-family="sans-serif" font-size="10">View Services</text>

  <!-- Right Visual Panels: Before & After Transformation + Services -->
  <!-- Before/After Smile Transformation Card -->
  <rect x="455" y="145" width="265" height="135" rx="10" fill="url(#heroCardGrad)" stroke="#1e3a4f" stroke-width="1" />
  <text x="472" y="168" fill="#ffffff" font-family="'Syne', sans-serif" font-weight="700" font-size="12">Smile Transformations</text>
  <rect x="625" y="156" width="80" height="18" rx="9" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4" />
  <text x="635" y="169" fill="#34d399" font-family="'DM Mono', monospace" font-size="8">BEFORE / AFTER</text>

  <!-- Transformation split visual -->
  <rect x="472" y="180" width="112" height="75" rx="6" fill="#091b29" stroke="#1e3549" />
  <text x="485" y="215" fill="#64748b" font-family="'DM Mono', monospace" font-size="9">Initial Alignment</text>
  <rect x="482" y="235" width="45" height="14" rx="3" fill="#475569" fill-opacity="0.5" />
  <text x="490" y="245" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="8">Before</text>

  <!-- Divider arrow -->
  <text x="590" y="222" fill="#2dd4bf" font-size="14">➔</text>

  <rect x="608" y="180" width="102" height="75" rx="6" fill="#07232e" stroke="#2dd4bf" stroke-opacity="0.5" />
  <text x="618" y="215" fill="#2dd4bf" font-family="'DM Mono', monospace" font-size="9">Designed Smile</text>
  <rect x="618" y="235" width="40" height="14" rx="3" fill="#2dd4bf" fill-opacity="0.3" />
  <text x="626" y="245" fill="#5eead4" font-family="'DM Mono', monospace" font-size="8">After</text>

  <!-- Services Pills Row -->
  <rect x="455" y="290" width="265" height="95" rx="10" fill="#081824" stroke="#1a3449" stroke-width="1" />
  <text x="472" y="312" fill="#e2e8f0" font-family="sans-serif" font-weight="600" font-size="11">Specialized Treatments</text>
  
  <rect x="472" y="324" width="115" height="22" rx="4" fill="#13293a" stroke="#2dd4bf" stroke-opacity="0.3" />
  <text x="480" y="339" fill="#2dd4bf" font-family="sans-serif" font-size="9">✦ Cosmetic Dentistry</text>

  <rect x="595" y="324" width="112" height="22" rx="4" fill="#13293a" stroke="#2dd4bf" stroke-opacity="0.3" />
  <text x="603" y="339" fill="#2dd4bf" font-family="sans-serif" font-size="9">✦ Teeth Whitening</text>

  <rect x="472" y="352" width="100" height="22" rx="4" fill="#13293a" stroke="#2dd4bf" stroke-opacity="0.3" />
  <text x="480" y="367" fill="#7dd3fc" font-family="sans-serif" font-size="9">✦ Orthodontics</text>

  <rect x="580" y="352" width="127" height="22" rx="4" fill="#13293a" stroke="#2dd4bf" stroke-opacity="0.3" />
  <text x="588" y="367" fill="#7dd3fc" font-family="sans-serif" font-size="9">✦ Dental Implants</text>
</svg>
